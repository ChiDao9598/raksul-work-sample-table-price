<div class="price-table-component">
  <div class="table-scroll">
  <table (mouseleave)="clearHover()">
    <thead>
      <tr>
        <th class="corner">
          <span class="corner-day">Business Days</span>
          <span class="corner-qty">Quantity</span>
        </th>
        @for (day of table().businessDays; track day) {
          <th scope="col" [class.header--hovered]="hovered()?.businessDay === day">
            {{ dayLabel(day) }}
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (qty of visibleQuantities(); track qty) {
        <tr>
          <th (mouseleave)="clearHover()" scope="row" class="row-header" [class.header--hovered]="hovered()?.quantity === qty">
            {{ qty }}
          </th>

          @for (day of table().businessDays; track day) {
            @let price = priceOf(qty, day);
            <td
            (mouseleave)="clearHover()"
              class="cell"
              [class.row--hovered]="hovered()?.quantity === qty"
              [class.col--hovered]="hovered()?.businessDay === day"
              [class.cell-selected]="isSelected(qty, day)"
              [class.cell-hovered]="isHovered(qty, day)"
              (mouseenter)="setHover(qty, day)"
            >
              @if (price !== null) {
                <button
                  type="button"
                  class="cell-button"
                  (click)="select(qty, day)"
                  (focus)="setHover(qty, day)"
                  (blur)="clearHover()"
                >
                  {{ price | formatPrice }} VND
                </button>
              } @else {
                <span class="cell-empty">—</span>
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
  </div>

  @if (canExpand()) {
    <div class="toggle-expand">
      <button
        type="button"
        class="see-more"
        [attr.aria-expanded]="expanded()"
        (click)="toggleExpand()"
      >
        {{ expanded() ? 'See less' : 'See more' }}
      </button>
    </div>
  }
</div>
