<form class="selector-paperSize-form" (submit)="onSubmit($event)">
    <label class="form-title" for="paper-size">Select Paper Size</label>

    <div class="selector-wrapper">
        <select name="pagerSize" id="paper-size" (change)="onChange($event)">
            @for(size of sizes; track size) {
                <option [value]="size" [selected]="size === paperSizeSelected()"> {{size}} </option>
            }
        </select>
    </div>
    <p class="hint">
        @if(hasPendingChange()) {
            Click Apply to show {{ paperSizeSelected() }} prices
        }
    </p>

    <button type="submit">Apply</button>
</form>
