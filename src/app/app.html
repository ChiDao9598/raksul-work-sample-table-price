<main class="layout">
  <h1>RAKSUL'S Work Sample</h1>
  <section class="wrap-table-price">
    <div class="wrapper paper-selector">
      <app-paper-size-selector [value]="store.paperSize()" (apply)="store.apply($event)" />
    </div>
    <div class="wrapper table-ui">
      <span class="table-heading">Page Size Selected: {{ store.paperSize() }}</span>
      @if (store.error(); as error) {
        <div class="status status--error" role="alert">
          <p>{{ error }}</p>
        </div>
      } @else if (store.loading() || !store.table()) {
        <div class="status" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading {{ store.paperSize() }} prices, please wait…</p>
        </div>
      } @else if (store.table(); as table) {
        <div class="table-area">
          <app-price-table
            [table]="table"
            [selected]="store.selected()"
            [expanded]="store.expanded()"
            (cellSelected)="store.select($event)"
            (expandedChange)="store.setExpanded($event)"
          />
        </div>
      }
    </div>
  </section>
  <section class="wrap-order-price">
    <div class="wrapper">
      <app-order-summary-component
        [price]="store.selectedPrice()"
        [paperSize]="store.paperSize()"
        [selected]="store.selected()"
      ></app-order-summary-component>
    </div>
  </section>
</main>
<router-outlet />
